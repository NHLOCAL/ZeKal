title: "זה קל!"
tagline: "כל הפרויקטים והכלים מבית NH LOCAL"
description: "כל הפרויקטים של NH Local במקום אחד: כלי AI ותמלול, מוזיקה, תוכנות למחשב ומדריכים בעברית. מוצאים את הכלי המתאים ומתחילים בקלות"
baseurl: ""
url: "https://ze-kal.top"
language: "he"
lang: "he_IL"
logo: "/assets/images/brand-mark.svg"
author: "NH LOCAL"
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
navbar:
  - title: "כל הפרויקטים"
    url: /#projects
  - title: "לומדים בקלות"
    url: /learn/
  - title: "הבלוג"
    url: https://blog.ze-kal.top/
  - title: "אודות"
    url: /#about
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /:categories/:title:output_ext
social:
  name: "זה קל!"
  links:
    - https://github.com/NHLOCAL
    - https://nhlocal.github.io/
    - https://www.youtube.com/@Ze-Kal
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: "זה קל! מבית NH LOCAL, כל הפרויקטים בבית אחד"
  - scope:
      path: "topics"
    values:
      layout: default
      section: learning
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - run.bat
  - convert_to_table.py
