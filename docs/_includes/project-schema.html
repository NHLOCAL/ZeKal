<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ page.title | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "itemListElement": [
  {% assign listed_projects = site.data.projects %}{% if page.category %}{% assign listed_projects = site.data.projects | where_exp: 'item', 'item.categories contains page.category' %}{% endif %}
  {% for project in listed_projects %}
    {"@type":"ListItem","position":{{ forloop.index }},"item":{"@type":"CreativeWork","name":{{ project.name | jsonify }},"description":{{ project.summary | jsonify }},"url":{{ project.url | absolute_url | jsonify }}}}{% unless forloop.last %},{% endunless %}
  {% endfor %}
  ]
}
</script>
{% if page.home %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","@id":"{{ '/' | absolute_url }}#website","name":"זה קל!","alternateName":["ZeKal","זה קל"],"url":{{ '/' | absolute_url | jsonify }},"inLanguage":"he","creator":{"@type":"Person","name":"NH Local","url":"https://nhlocal.github.io/","sameAs":["https://github.com/NHLOCAL","https://blog.ze-kal.top/"]}}</script>
{% else %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"זה קל!","item":{{ '/' | absolute_url | jsonify }}},{"@type":"ListItem","position":2,"name":{{ category.name | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}]}</script>
{% endif %}
